name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA for Sideloadly & AltStore
    runs-on: macos-14
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate iOS Xcode Project)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Project (Unsigned for Sideloadly & AltStore)
        run: |
          cd ios
          echo "Building workspace ZeloShop.xcworkspace with scheme ZeloShop..."

          mkdir -p build
          xcodebuild build \
            -workspace "ZeloShop.xcworkspace" \
            -scheme "ZeloShop" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found compiled .app bundle at: $APP_PATH"
          echo "Checking app bundle contents:"
          ls -la "$APP_PATH"
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r -y "ZeloShop.ipa" Payload
          ls -lh ZeloShop.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloShop-iOS-IPA
          path: ios/output/ZeloShop.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases and AltStore Source
        if: github.ref == 'refs/heads/main'
        run: |
          python3 .github/scripts/publish_release.py ios/output/ZeloShop.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

