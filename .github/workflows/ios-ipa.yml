name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA for Sideloadly
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild (Generate iOS Xcode Project)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Project (Unsigned for Sideloadly)
        run: |
          cd ios
          echo "Building workspace ZeloShop.xcworkspace with scheme ZeloShop..."

          mkdir -p build
          xcodebuild build \
            -workspace "ZeloShop.xcworkspace" \
            -scheme "ZeloShop" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found compiled .app bundle at: $APP_PATH"
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r -y "ZeloShop.ipa" Payload
          ls -lh ZeloShop.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloShop-iOS-IPA
          path: ios/output/ZeloShop.ipa
          if-no-files-found: error
          retention-days: 14
